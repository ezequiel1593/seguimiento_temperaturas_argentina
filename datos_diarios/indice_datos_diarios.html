<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Datos Diarios</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    :root {
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
      --table-stripe: #f1f5f9;
      --table-hover: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.6rem;
      color: #1e293b;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
      margin-bottom: 25px;
      background-color: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    select, input[type="number"] {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background-color: #fff;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }

    button {
      padding: 9px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    thead tr {
      background-color: #1e293b;
      color: #ffffff;
    }

    th, td {
      padding: 12px 16px;
    }

    th {
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    tbody tr:hover {
      background-color: var(--table-hover);
    }

    .text-center {
      text-align: center;
      color: #64748b;
      font-style: italic;
    }

    .text-error {
      text-align: center;
      color: #dc2626;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Consulta de Datos Diarios</h2>
    
    <div class="controls-panel">
      <div class="input-group">
        <label for="estacionSelect">Estación</label>
        <!-- Select dinámico -->
        <select id="estacionSelect">
          <option value="">Cargando estaciones...</option>
        </select>
      </div>

      <div class="input-group">
        <label for="anioInput">Año</label>
        <input type="number" id="anioInput" placeholder="Ej: 1997" min="1870" max="2030" style="width: 100px;">
      </div>

      <button id="btnConsultar" onclick="cargarBaseDatos()">Consultar</button>
    </div>

    <div class="table-wrapper">
      <table id="tablaResultados">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tmin (°C)</th>
            <th>Tmax (°C)</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr>
            <td colspan="3" class="text-center">Selecciona los filtros para realizar la consulta.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let dbSQL = null;

    // Cargar sql.js y la lista de estaciones al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      cargarEstaciones();

      window.initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
      }).then(function(sql) {
        dbSQL = sql;
        console.log("Motor SQL.js preparado.");
      });
    });

    // Función para obtener estaciones.json y llenar el selector
    async function cargarEstaciones() {
      const select = document.getElementById("estacionSelect");
      try {
        const response = await fetch("estaciones.json");
        if (!response.ok) throw new Error("No se pudo cargar la lista de estaciones.");
        
        const estaciones = await response.json();
        
        select.innerHTML = '<option value="">-- Selecciona una estación --</option>';
        estaciones.forEach(est => {
          const option = document.createElement("option");
          option.value = est;
          option.textContent = est;
          select.appendChild(option);
        });
      } catch (err) {
        console.error("Error al cargar lista de estaciones:", err);
        select.innerHTML = '<option value="">Error al cargar estaciones</option>';
      }
    }

    function formatearFecha(fechaIso) {
      if (!fechaIso || fechaIso === "NA" || fechaIso === "null") return "s/d";
      const partes = String(fechaIso).split("-");
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }
      return fechaIso;
    }

    async function cargarBaseDatos() {
      const select = document.getElementById("estacionSelect");
      const anioInput = document.getElementById("anioInput").value.trim();
      const nombreEstacion = select.value;
      const cuerpo = document.getElementById("cuerpoTabla");

      if (!nombreEstacion) {
        alert("Selecciona una estación.");
        return;
      }

      if (!dbSQL) {
        alert("Cargando motor SQL, reintenta en un momento...");
        return;
      }

      cuerpo.innerHTML = "<tr><td colspan='3' class='text-center'>Cargando datos...</td></tr>";

      try {
        const url = `${nombreEstacion}.sqlite`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`No se encontró el archivo: ${url}`);
        }

        const buffer = await response.arrayBuffer();
        const db = new dbSQL.Database(new Uint8Array(buffer));

        let query = "SELECT Fecha, Tmin, Tmax FROM diarios";
        
        if (anioInput !== "") {
          query += ` WHERE strftime('%Y', Fecha) = '${anioInput}'`;
        }

        query += " ORDER BY Fecha ASC";

        const res = db.exec(query);
        cuerpo.innerHTML = "";

        if (res.length > 0) {
          const filas = res[0].values;
          
          filas.forEach(fila => {
            const fechaVal = formatearFecha(fila[0]);
            const tminVal  = (fila[1] === null || fila[1] === undefined || fila[1] === "NA") ? "s/d" : fila[1];
            const tmaxVal  = (fila[2] === null || fila[2] === undefined || fila[2] === "NA") ? "s/d" : fila[2];

            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${fechaVal}</td><td>${tminVal}</td><td>${tmaxVal}</td>`;
            cuerpo.appendChild(tr);
          });
        } else {
          cuerpo.innerHTML = "<tr><td colspan='3' class='text-center'>No se encontraron registros para ese año.</td></tr>";
        }

      } catch (error) {
        console.error("Error al consultar:", error);
        cuerpo.innerHTML = `<tr><td colspan='3' class='text-error'>Error: ${error.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
